[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kit-onnx"
version = "0.1.0"
description = "ONNX backend for the mlopt game (ADR 0006): mlopt IR <-> ONNX graph — OnnxSink exports, OnnxSource imports, both verified through onnxruntime. Split from handl-lang/graphopt packages/mlopt-onnx (P3 Step D-1)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlopt-core",
    "mlopt-dtypes",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "numpy>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "coverage>=7.0",
    "ty>=0.0.84",
    # test_onnx_opmap has one torch-oracle parity check
    # (test_pad_with_a_fill_value_matches_torch).
    "torch>=2.0",
]

# Substrate pins for local dev — consumers that git-pin `kit-onnx`
# resolve `mlopt-core`/`mlopt-dtypes` through their own
# `[tool.uv.sources]` (uv honours sources only at the workspace root).
[tool.uv.sources]
mlopt-core = { git = "https://github.com/handl-lang/eqsat.git", subdirectory = "packages/mlopt-core", tag = "v0.1.8" }
mlopt-dtypes = { git = "https://github.com/handl-lang/eqsat.git", subdirectory = "packages/mlopt-dtypes", tag = "v0.1.8" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: crosses an external engine boundary (onnxruntime); module-level marker, tagged on boundary-purpose files only",
]

[tool.ruff]
target-version = "py311"
line-length = 72

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = [
    "E501",     # line length — math/notation lines exceed 72 legitimately
    "B008",     # function-call in default arg — used for cost-fn defaults
    "SIM108",   # ternary suggestion — if/else often clearer here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# --- typecheck (ty) -----------------------------------------------
[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src"]
exclude = []

[tool.ty.terminal]
error-on-warning = false

[tool.coverage.run]
source = ["kit_onnx"]
branch = true
omit = ["*/tests/*"]
