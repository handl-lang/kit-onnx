[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kit-onnx"
version = "0.1.0"
description = "ONNX backend for the mlopt game (ADR 0006): mlopt IR <-> ONNX graph — OnnxSink exports, OnnxSource imports, both verified through onnxruntime. Split from handl-lang/graphopt packages/mlopt-onnx (P3 Step D-1)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mlopt-core",
    "mlopt-dtypes",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "numpy>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "coverage>=7.0",
    "ty>=0.0.84",
    "import-linter>=2.15",
    # test_onnx_opmap has one torch-oracle parity check
    # (test_pad_with_a_fill_value_matches_torch).
    "torch>=2.0",
]

# Substrate pins for local dev — consumers that git-pin `kit-onnx`
# resolve `mlopt-core`/`mlopt-dtypes` through their own
# `[tool.uv.sources]` (uv honours sources only at the workspace root).
[tool.uv.sources]
mlopt-core = { git = "https://github.com/handl-lang/eqsat.git", subdirectory = "packages/mlopt-core", tag = "v0.1.14" }
mlopt-dtypes = { git = "https://github.com/handl-lang/eqsat.git", subdirectory = "packages/mlopt-dtypes", tag = "v0.1.14" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: crosses an external engine boundary (onnxruntime); module-level marker, tagged on boundary-purpose files only",
]

[tool.ruff]
target-version = "py311"
line-length = 72

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = [
    "E501",     # line length — math/notation lines exceed 72 legitimately
    "B008",     # function-call in default arg — used for cost-fn defaults
    "SIM108",   # ternary suggestion — if/else often clearer here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# --- typecheck (ty) -----------------------------------------------
[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src"]
exclude = []

[tool.ty.terminal]
error-on-warning = false

[tool.coverage.run]
source = ["kit_onnx"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
# Phase-1 measurement (audit P11-N2): 43.12% total coverage over the
# package-bound suite — lift.py/liftmap.py/opmap.py are exercised
# through graphopt's suite via the git dep, not here.  Floor set at
# the measurement rounded down; tighten, never lower (ratchet
# convention, same as discoverykit/gamekit/eqsat).
fail_under = 43
show_missing = true
exclude_also = [
    "if __name__ == ['\"]__main__['\"]:",
    "if TYPE_CHECKING:",
    "def __repr__",
    "raise NotImplementedError",
    "@overload",
    "return NotImplemented",
]

# import-linter: the "leaf by contract" layering, statically
# (audit P11-N2).  kit_onnx binds only stdlib + mlopt-core +
# mlopt-dtypes + onnx/onnxruntime/numpy at module level — the
# torch/kit_torch(+mlopt_torch)/kit_carriers/mlopt_orchestrator/mlopt_host_tensor/
# kit_cuda family is forbidden outright.  torch appears only in
# tests/ (one opmap parity check), which is outside
# ``root_packages``; ``include_external_packages`` makes the
# third-party binds (torch, onnxruntime) visible to the contract.
[tool.importlinter]
root_packages = ["kit_onnx"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "kit_onnx is a leaf — no torch, no mlopt domain packages"
type = "forbidden"
source_modules = ["kit_onnx"]
forbidden_modules = [
    "torch",
    "kit_torch",
    "mlopt_torch",
    "kit_carriers",
    "mlopt_orchestrator",
    "mlopt_host_tensor",
    "kit_cuda",
]
